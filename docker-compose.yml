# Secrets come from .env (copy .env.example). They are required on purpose:
# the stack refuses to start rather than fall back to weak defaults.
#
# Third-party images are pinned by digest (the tag is only a label then);
# Dependabot keeps both up to date.

services:
  api:
    build: .
    image: pulseops
    # Back up on its own after a crash or a Docker restart; `docker compose
    # stop` still stops it for good.
    restart: unless-stopped
    # Localhost only until the reverse proxy arrives in Phase 9 (ADR-029).
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      API_KEY: ${API_KEY:?set it in .env}
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      DATABASE_URL: postgresql+asyncpg://pulseops_app:${PULSEOPS_APP_PASSWORD:?set it in .env}@postgres:5432/pulseops
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      # No BROKER_URL: the API never uses the queue, so it never gets the
      # Valkey password.
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Runs the scheduler (every 5 s) and the checks. No API key and no published
  # port: it only talks to PostgreSQL, Valkey and the monitored sites.
  worker:
    build: .
    image: pulseops
    # If the worker died and stayed down, nothing would be checked and nothing
    # would say so. A hung (alive) worker is not covered: that is what the
    # scheduler heartbeat is for.
    restart: unless-stopped
    command: ["ardiq", "run", "--quiet", "pulseops.worker:app"]
    environment:
      DATABASE_URL: postgresql+asyncpg://pulseops_app:${PULSEOPS_APP_PASSWORD:?set it in .env}@postgres:5432/pulseops
      BROKER_URL: redis://:${VALKEY_PASSWORD:?set it in .env}@valkey:6379/0
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    # On stop, ArdiQ finishes the checks in flight (10 s deadline each).
    stop_grace_period: 15s

  # One-shot: applies pending migrations as the schema owner, then exits.
  migrate:
    build: .
    image: pulseops
    # Never restarted: it must run once and exit.
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://pulseops_owner:${PULSEOPS_OWNER_PASSWORD:?set it in .env}@postgres:5432/pulseops
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    restart: unless-stopped
    # No DETAIL lines in the error log: on a duplicate monitor URL (the 409)
    # PostgreSQL would log "Key (url)=(<the full URL>) already exists", and
    # URLs may carry tokens (ADR-044).
    command: ["postgres", "-c", "log_error_verbosity=terse"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set it in .env}
      PULSEOPS_OWNER_PASSWORD: ${PULSEOPS_OWNER_PASSWORD:?set it in .env}
      PULSEOPS_APP_PASSWORD: ${PULSEOPS_APP_PASSWORD:?set it in .env}
    # Published on localhost only, so tests can run from the host.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP on purpose: during first-time init the server only listens on
      # the Unix socket, so this stays unhealthy until roles and DBs exist.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    restart: unless-stopped
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set it in .env}
    command: ["sh", "-c", 'exec valkey-server --requirepass "$$VALKEY_PASSWORD"']
    # Published on localhost only (and password-protected), so tests can run
    # against a real broker from the host. Host port 6380, so it never clashes
    # with another local Redis on 6379.
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'VALKEYCLI_AUTH="$$VALKEY_PASSWORD" valkey-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  valkey-data:
