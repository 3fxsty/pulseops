# Runs on every pull request and on every push to main.
#
# Hardening: read-only token, actions pinned to a commit SHA (a tag can be
# moved to point at other code; a SHA cannot), no pull_request_target (it
# would run a PR's code with the repository's permissions).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a PR cancels its previous run; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the token in .git/config for later steps.
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5" # same as the Dockerfile
      # --locked fails if uv.lock is out of date, so CI runs the exact
      # versions of Ruff and pytest used locally.
      - run: uv sync --locked
      # The github format annotates the offending lines in the PR.
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
