version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # A PostgreSQL major upgrade (18 -> 19) changes the on-disk format and
      # needs pg_upgrade or a dump and restore: done by hand, never by a PR.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # The workflow's actions are pinned by SHA; this keeps the SHAs (and their
  # version comments) up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
